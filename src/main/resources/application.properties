spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/smart_residential}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true

app.cache.default-ttl=10m
app.cache.issue-categories-ttl=30m
app.cache.buildings-ttl=10m
app.cache.apartments-ttl=5m
app.cache.issues-ttl=2m

app.attachments.storage-dir=${ATTACHMENTS_STORAGE_DIR:uploads/attachments}
app.attachments.max-file-size-bytes=${ATTACHMENTS_MAX_FILE_SIZE_BYTES:104857600}
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:105MB}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=true

app.flyway.tenant-location=classpath:db/migration/tenant

