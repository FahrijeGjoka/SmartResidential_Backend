spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_residential}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true

app.cache.default-ttl=10m
app.cache.issue-categories-ttl=30m
app.cache.buildings-ttl=10m
app.cache.apartments-ttl=5m
app.cache.issues-ttl=2m

app.attachments.storage-dir=${ATTACHMENTS_STORAGE_DIR:uploads/attachments}
app.attachments.max-file-size-bytes=${ATTACHMENTS_MAX_FILE_SIZE_BYTES:104857600}
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:105MB}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=true

app.flyway.tenant-location=classpath:db/migration/tenant

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET:dev_only_change_me_dev_only_change_me_123456}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}
app.auth.refresh-cookie.max-age-seconds=${REFRESH_COOKIE_MAX_AGE_SECONDS:1209600}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

ollama.api.url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model.name=${OLLAMA_MODEL:llama3.1}
ollama.connect-timeout-ms=${OLLAMA_CONNECT_TIMEOUT_MS:3000}
ollama.read-timeout-ms=${OLLAMA_READ_TIMEOUT_MS:8000}
